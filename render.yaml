services:
  - type: web
    name: miracles-backend
    env: node
    buildCommand: npm install
    startCommand: npm run start:backend
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
